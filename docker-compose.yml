# ============================================================
# VyroFlix — Local Infrastructure Docker Compose
# Zero-cost local development environment
# ============================================================


services:
  # ------------------------------------------------------------
  # PostgreSQL 16 — Metadata & Domain Schemas
  # ------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    container_name: vyroflix-postgres
    restart: unless-stopped
    ports:
      - "5432:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-vyroflix}
      POSTGRES_USER: ${POSTGRES_USER:-vyroflix}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-vyroflix}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./infra/docker/postgres-init/init-schemas.sql:/docker-entrypoint-initdb.d/01-init-schemas.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vyroflix -d vyroflix"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vyroflix-network

  # ------------------------------------------------------------
  # Redis 7 — Cache, Entitlements, Rate Limiting, Master Keys
  # ------------------------------------------------------------
  redis:
    image: redis:7-alpine
    container_name: vyroflix-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vyroflix-network

  # ------------------------------------------------------------
  # Apache Kafka (KRaft mode) — Asynchronous Event Bus
  # ------------------------------------------------------------
  kafka:
    image: apache/kafka:3.7.0
    container_name: vyroflix-kafka
    restart: unless-stopped
    ports:
      - "9092:9092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9094,EXTERNAL://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9094,EXTERNAL://localhost:9092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT,CONTROLLER:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_LOG_DIRS: /var/lib/kafka/data
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"
    volumes:
      - kafka_data:/var/lib/kafka/data
    healthcheck:
      test: ["CMD-SHELL", "/opt/kafka/bin/kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 5
    networks:
      - vyroflix-network

  # ------------------------------------------------------------
  # Kafka UI — Visual Dashboard for Topics, Consumers & Events
  # ------------------------------------------------------------
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: vyroflix-kafka-ui
    restart: unless-stopped
    ports:
      - "8090:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9094
    depends_on:
      - kafka
    networks:
      - vyroflix-network

  # ------------------------------------------------------------
  # MinIO — S3-Compatible Local Object Store (Cloudflare R2 mock)
  # ------------------------------------------------------------
  minio:
    image: minio/minio:latest
    container_name: vyroflix-minio
    restart: unless-stopped
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-vyroflix}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-vyroflix123}
    command: server /data --console-address ":9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD-SHELL", "mc ready local || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - vyroflix-network

  # ------------------------------------------------------------
  # MinIO Bucket Provisioner — Auto-creates raw & HLS buckets
  # ------------------------------------------------------------
  minio-init:
    image: minio/mc:latest
    container_name: vyroflix-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until (/usr/bin/mc config host add local http://minio:9000 ${MINIO_ROOT_USER:-vyroflix} ${MINIO_ROOT_PASSWORD:-vyroflix123}) do echo 'Waiting for MinIO...' && sleep 2; done;
      /usr/bin/mc mb --ignore-existing local/vyroflix-raw;
      /usr/bin/mc mb --ignore-existing local/vyroflix-content;
      /usr/bin/mc mb --ignore-existing local/vyroflix-raw-media;
      /usr/bin/mc mb --ignore-existing local/vyroflix-hls-media;
      /usr/bin/mc anonymous set download local/vyroflix-content;
      /usr/bin/mc anonymous set download local/vyroflix-hls-media;
      echo 'VyroFlix MinIO buckets ready!';
      exit 0;
      "
    networks:
      - vyroflix-network

  # ------------------------------------------------------------
  # Prometheus — Metrics Collection
  # ------------------------------------------------------------
  prometheus:
    image: prom/prometheus:v2.51.0
    container_name: vyroflix-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./infra/observability/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
    networks:
      - vyroflix-network

  # ------------------------------------------------------------
  # Grafana — Observability Dashboards
  # ------------------------------------------------------------
  grafana:
    image: grafana/grafana:10.4.0
    container_name: vyroflix-grafana
    restart: unless-stopped
    ports:
      - "3001:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus
    networks:
      - vyroflix-network

# ------------------------------------------------------------
# Named Volumes & Networks
# ------------------------------------------------------------
volumes:
  postgres_data:
  redis_data:
  kafka_data:
  minio_data:
  prometheus_data:
  grafana_data:

networks:
  vyroflix-network:
    name: vyroflix-network
    driver: bridge
