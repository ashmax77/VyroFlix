server:
  port: 8080

spring:
  application:
    name: api-gateway
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  cloud:
    gateway:
      # Global CORS configuration
      globalcors:
        cors-configurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:3000"
              - "${CORS_ALLOWED_ORIGIN:http://localhost:3000}"
            allowedMethods:
              - GET
              - POST
              - PUT
              - DELETE
              - OPTIONS
              - PATCH
            allowedHeaders: "*"
            allowCredentials: true
            maxAge: 3600

      # Downstream microservice route definitions
      routes:
        # Identity Service — Auth & User Management
        - id: identity-service
          uri: ${SERVICES_IDENTITY_URL:http://localhost:8081}
          predicates:
            - Path=/api/v1/auth/**, /api/v1/users/**

        # Content Service — Catalog, Titles, Genres
        - id: content-service
          uri: ${SERVICES_CONTENT_URL:http://localhost:8082}
          predicates:
            - Path=/api/v1/catalog/**

        # Video Service — Upload Intents & Raw Video Ingestion
        - id: video-service
          uri: ${SERVICES_VIDEO_URL:http://localhost:8083}
          predicates:
            - Path=/api/v1/videos/**

        # Streaming Service — Playback Session Authorization & Manifests
        - id: streaming-service
          uri: ${SERVICES_STREAMING_URL:http://localhost:8085}
          predicates:
            - Path=/api/v1/streaming/**

        # History Service — Watch Progress, Watchlist, Completion
        - id: history-service
          uri: ${SERVICES_HISTORY_URL:http://localhost:8086}
          predicates:
            - Path=/api/v1/history/**

        # Search Service — Search Index & Query
        - id: search-service
          uri: ${SERVICES_SEARCH_URL:http://localhost:8087}
          predicates:
            - Path=/api/v1/search/**

        # Recommendation Service — Personalization & Trending Rails
        - id: recommendation-service
          uri: ${SERVICES_RECOMMENDATION_URL:http://localhost:8088}
          predicates:
            - Path=/api/v1/recommendations/**

  # Security — Supabase JWKS token validation
  security:
    oauth2:
      resourceserver:
        jwt:
          jwk-set-uri: ${SUPABASE_JWKS_URI:${SUPABASE_URL:https://placeholder.supabase.co}/auth/v1/.well-known/jwks.json}

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} [%thread] %-5level %logger{36} [corr=%X{correlationId}] - %msg%n"
  level:
    root: INFO
    com.vyroflix: DEBUG
    org.springframework.cloud.gateway: INFO
