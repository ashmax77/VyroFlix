server:
  port: 8083

spring:
  application:
    name: video-service
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:vyroflix}?currentSchema=video}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:vyroflix}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:vyroflix}}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        default_schema: video
        format_sql: true

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    schemas: video
    default-schema: video

management:
  endpoints:
    web:
      exposure:
        include: health, info, prometheus, metrics
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
