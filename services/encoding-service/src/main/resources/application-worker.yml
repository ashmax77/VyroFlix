# ============================================================
# VyroFlix Encoding Worker — Standalone Transcoder Profile
# Consumes video.uploaded.v1, executes FFmpeg multi-rendition HLS,
# uploads to Cloudflare R2 / MinIO, and emits video.encoded.v1.
# ============================================================
server:
  port: ${PORT:8084}

spring:
  application:
    name: encoding-worker

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:vyroflix}?currentSchema=encoding}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: VyroFlixWorkerPool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:3}
      minimum-idle: 1
      connection-timeout: 20000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        default_schema: encoding
        format_sql: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    locations: classpath:db/migration/encoding
    schemas: encoding
    default-schema: encoding
    baseline-on-migrate: true

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: ${KAFKA_ENCODING_GROUP_ID:vyroflix-encoding-worker}
      auto-offset-reset: earliest
      enable-auto-commit: true
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}

vyroflix:
  storage:
    enabled: true
    provider: ${STORAGE_PROVIDER:R2}
    endpoint: ${R2_ENDPOINT:http://localhost:9000}
    region: ${R2_REGION:auto}
    access-key: ${R2_ACCESS_KEY_ID:minioadmin}
    secret-key: ${R2_SECRET_ACCESS_KEY:minioadmin}
    path-style-access-enabled: true
    raw-bucket: ${R2_BUCKET_RAW:vyroflix-raw}
    content-bucket: ${R2_BUCKET_CONTENT:vyroflix-content}

  encoding:
    ffmpeg-path: ${FFMPEG_PATH:ffmpeg}
    timeout-minutes: ${ENCODING_TIMEOUT_MINUTES:60}

  outbox:
    relay-interval-ms: 2000
    batch-size: 10
    max-retries: 3
    retention-days: 7

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.vyroflix.encoding: DEBUG
    com.vyroflix.common: INFO
