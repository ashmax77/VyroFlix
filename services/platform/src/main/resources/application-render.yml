# ============================================================
# VyroFlix Platform — Render Free Tier Production Profile
# Optimized for 512 MB RAM limit and Supabase / Upstash free limits
# ============================================================
server:
  port: ${PORT:8081}
  shutdown: graceful

spring:
  application:
    name: vyroflix-platform

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB:postgres}?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: VyroFlixRenderPool
      # Restrict pool size to 5 to avoid exhausting Supabase Free connection quota (15 max)
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    schemas: public,content,identity,video,encoding,streaming,history,search,recommendation

  data:
    redis:
      url: ${UPSTASH_REDIS_URL:}
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:true}
      timeout: 3000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false

# Cloudflare R2 / S3 Configuration
aws:
  s3:
    endpoint: ${CLOUDFLARE_R2_ENDPOINT:https://YOUR_ACCOUNT_ID.r2.cloudflarestorage.com}
    access-key: ${CLOUDFLARE_R2_ACCESS_KEY_ID:YOUR_R2_ACCESS_KEY}
    secret-key: ${CLOUDFLARE_R2_SECRET_ACCESS_KEY:YOUR_R2_SECRET_KEY}
    region: ${AWS_REGION:auto}
    bucket-raw: ${CLOUDFLARE_R2_BUCKET_RAW:vyroflix-raw}
    bucket-content: ${CLOUDFLARE_R2_BUCKET_CONTENT:vyroflix-content}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.vyroflix: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
