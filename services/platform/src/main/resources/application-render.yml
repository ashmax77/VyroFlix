# ============================================================
# VyroFlix Platform — Render Free Tier Production Profile
# Optimized for 512 MB RAM limit and Supabase / Upstash free limits
# ============================================================
server:
  port: ${PORT:8081}
  shutdown: graceful

spring:
  application:
    name: vyroflix-platform

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST}:${POSTGRES_PORT:5432}/${POSTGRES_DB:postgres}?sslmode=require}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:postgres}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: VyroFlixRenderPool
      # Restrict pool size to 5 to avoid exhausting Supabase Free connection quota (15 max)
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:5}
      minimum-idle: 1
      idle-timeout: 300000
      max-lifetime: 600000
      connection-timeout: 20000
      validation-timeout: 5000

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
    show-sql: false
    properties:
      hibernate:
        format_sql: false
        jdbc:
          batch_size: 25

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    schemas: public

  data:
    redis:
      # Note: spring.data.redis.url is dynamically injected by DatabaseUrlEnvironmentPostProcessor
      # when UPSTASH_REDIS_URL or SPRING_DATA_REDIS_URL is provided, avoiding empty string crashes.
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: ${REDIS_SSL:true}
      timeout: 3000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    properties:
      security.protocol: ${KAFKA_SECURITY_PROTOCOL:PLAINTEXT}
      sasl.mechanism: ${KAFKA_SASL_MECHANISM:SCRAM-SHA-256}
      sasl.jaas.config: ${KAFKA_SASL_JAAS_CONFIG:}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false

vyroflix:
  # Playback authorisation calls History in-process over loopback (fail-open, see HistoryProgressClient).
  services:
    history-url: ${HISTORY_SERVICE_URL:http://localhost:${PORT:8081}}
  # Set PLAYBACK_CDN_BASE_URL to the Cloudflare Worker route to enable signed CDN playback.
  # PLAYBACK_SIGNING_SECRET must match the Worker's HLS_SIGNING_SECRET (>= 32 characters).
  playback:
    cdn-base-url: ${PLAYBACK_CDN_BASE_URL:}
    signing-secret: ${PLAYBACK_SIGNING_SECRET:}
  # Cloudflare R2 (S3-compatible) — bound to StorageProperties
  storage:
    provider: R2
    endpoint: ${R2_ENDPOINT}
    region: ${R2_REGION:auto}
    access-key: ${R2_ACCESS_KEY_ID}
    secret-key: ${R2_SECRET_ACCESS_KEY}
    path-style-access-enabled: true
    raw-bucket: ${R2_BUCKET_RAW:vyroflix-raw}
    content-bucket: ${R2_BUCKET_CONTENT:vyroflix-content}

  # Supabase Auth JWT validation — bound to SecurityProperties
  security:
    jwks-uri: ${SUPABASE_JWKS_URI:${SUPABASE_URL}/auth/v1/.well-known/jwks.json}
    issuer: ${SUPABASE_JWT_ISSUER:${SUPABASE_URL}/auth/v1}
    audience: authenticated
    # Comma-separated exact origins or patterns. Set CORS_ALLOWED_ORIGINS to your Vercel domain(s).
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,https://*.vercel.app}

  # Event bus — bound to MessagingProperties (KAFKA uses spring.kafka above)
  messaging:
    type: ${MESSAGING_TYPE:kafka}
    upstash:
      rest-url: ${UPSTASH_KAFKA_REST_URL:}
      rest-token: ${UPSTASH_KAFKA_REST_TOKEN:}

management:
  endpoints:
    web:
      exposure:
        include: health, info, metrics, prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

logging:
  level:
    root: INFO
    com.vyroflix: INFO
    org.springframework.web: WARN
    org.hibernate: WARN
