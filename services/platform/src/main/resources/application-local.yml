server:
  port: 8081

# Local Docker Compose profile. Same shape as application-render.yml, with local defaults: plain PostgreSQL and
# Redis (no SSL), local Kafka, and MinIO as the S3-compatible object store. Supabase JWT validation stays on.
spring:
  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:vyroflix}}
    username: ${SPRING_DATASOURCE_USERNAME:${POSTGRES_USER:vyroflix}}
    password: ${SPRING_DATASOURCE_PASSWORD:${POSTGRES_PASSWORD:vyroflix}}
    driver-class-name: org.postgresql.Driver
    hikari:
      pool-name: VyroFlixLocalPool
      maximum-pool-size: ${HIKARI_MAX_POOL_SIZE:10}

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  flyway:
    enabled: ${FLYWAY_ENABLED:true}
    baseline-on-migrate: true
    schemas: public

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
      ssl:
        enabled: false
      timeout: 3000ms

  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      auto-offset-reset: earliest
      enable-auto-commit: false

vyroflix:
  storage:
    provider: MINIO
    endpoint: ${VYROFLIX_STORAGE_ENDPOINT:http://localhost:9000}
    region: ${VYROFLIX_STORAGE_REGION:us-east-1}
    access-key: ${VYROFLIX_STORAGE_ACCESS_KEY:vyroflix}
    secret-key: ${VYROFLIX_STORAGE_SECRET_KEY:vyroflix123}
    path-style-access-enabled: true
    raw-bucket: ${VYROFLIX_STORAGE_RAW_BUCKET:vyroflix-raw}
    content-bucket: ${VYROFLIX_STORAGE_CONTENT_BUCKET:vyroflix-content}

  security:
    jwks-uri: ${SUPABASE_JWKS_URI:${SUPABASE_URL}/auth/v1/.well-known/jwks.json}
    issuer: ${SUPABASE_JWT_ISSUER:${SUPABASE_URL}/auth/v1}
    audience: authenticated
    cors-allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000,http://localhost:3100}

  messaging:
    type: ${MESSAGING_TYPE:kafka}
  catalog:
    # Announces seeded titles so search and recommendations are populated (see CatalogReindexOnStartup).
    reindex-on-startup: ${CATALOG_REINDEX_ON_STARTUP:true}

management:
  endpoint:
    health:
      show-details: always

logging:
  level:
    root: INFO
    com.vyroflix: DEBUG
