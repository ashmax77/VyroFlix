# ============================================================
# VyroFlix — Render Blueprint (Infrastructure-as-Code)
# Zero-cost cloud deployment for the combined Spring Boot backend.
# Variables marked `sync: false` are entered in the Render dashboard
# and must never be committed. See docs/DEPLOYMENT_GUIDE.md.
# ============================================================

services:
  - type: web
    name: vyroflix-backend
    runtime: docker
    dockerfilePath: ./Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    autoDeploy: true

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: HIKARI_MAX_POOL_SIZE
        value: 5

      # Supabase PostgreSQL + Auth
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        sync: false
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false
      - key: SUPABASE_URL
        sync: false

      # Upstash Redis
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: REDIS_SSL
        value: true

      # Kafka (Upstash or any SASL_SSL broker)
      - key: MESSAGING_TYPE
        value: kafka
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: KAFKA_SASL_MECHANISM
        value: SCRAM-SHA-256
      - key: KAFKA_SASL_JAAS_CONFIG
        sync: false

      # Cloudflare R2 object storage
      - key: R2_ENDPOINT
        sync: false
      - key: R2_ACCESS_KEY_ID
        sync: false
      - key: R2_SECRET_ACCESS_KEY
        sync: false
      - key: R2_BUCKET_RAW
        value: vyroflix-raw
      - key: R2_BUCKET_CONTENT
        value: vyroflix-content
