name: VyroFlix CI/CD

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  packages: write

jobs:
  # ------------------------------------------------------------
  # 1. Backend Build, Static Analysis & Tests (Java 21)
  # ------------------------------------------------------------
  backend-build:
    name: Backend Build & Test (Java 21)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build and test with Maven
        run: mvn -B clean verify -f services/pom.xml

  # ------------------------------------------------------------
  # 2. Frontend Build, Lint & Standalone Bundle (Node 20)
  # ------------------------------------------------------------
  frontend-build:
    name: Frontend Build & Typecheck
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: apps/web/package-lock.json

      - name: Install dependencies
        working-directory: apps/web
        run: npm ci

      - name: Build web application
        working-directory: apps/web
        run: npm run build

  # ------------------------------------------------------------
  # 3. Docker Compose & Infrastructure Validation
  # ------------------------------------------------------------
  docker-compose-validation:
    name: Validate Docker Compose Configurations
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Verify Base Infrastructure Compose
        run: docker compose config --quiet

      - name: Verify Application Services Compose
        run: docker compose -f docker-compose.yml -f docker-compose.app.yml config --quiet

  # ------------------------------------------------------------
  # 4. k6 Load Testing Scripts Validation
  # ------------------------------------------------------------
  k6-validation:
    name: Validate k6 Load Test Suites
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Pull grafana/k6 container
        run: docker pull grafana/k6:latest

      - name: Validate k6 script execution syntax
        run: |
          for script in browse.js search.js playback.js progress.js; do
            echo "Validating /scripts/$script syntax with k6..."
            docker run --rm -v "${PWD}/tests/load:/scripts" grafana/k6 run --iterations 1 --vus 1 "/scripts/$script" || true
          done

  # ------------------------------------------------------------
  # 5. Container Image Builds & Publication (GHCR)
  # ------------------------------------------------------------
  docker-publish:
    name: Build & Publish Container Images
    needs: [ backend-build, frontend-build, docker-compose-validation ]
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (ghcr.io)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push Web Image
        uses: docker/build-push-action@v5
        with:
          context: apps/web
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/web:latest
            ghcr.io/${{ github.repository }}/web:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build and push Platform Backend Image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: infra/render/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository }}/platform:latest
            ghcr.io/${{ github.repository }}/platform:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
