# ============================================================
# VyroFlix — Render Blueprint (Infrastructure-as-Code)
# Zero-cost cloud deployment for combined Spring Boot backend
# ============================================================

services:
  - type: web
    name: vyroflix-backend
    runtime: docker
    dockerfilePath: ./infra/render/Dockerfile
    dockerContext: .
    plan: free
    region: oregon
    healthCheckPath: /actuator/health
    autoDeploy: true

    envVars:
      - key: SPRING_PROFILES_ACTIVE
        value: render
      - key: PORT
        value: 8081
      - key: HIKARI_MAX_POOL_SIZE
        value: 5

      # Supabase PostgreSQL (Set in Render Dashboard)
      - key: SPRING_DATASOURCE_URL
        sync: false
      - key: SPRING_DATASOURCE_USERNAME
        value: postgres
      - key: SPRING_DATASOURCE_PASSWORD
        sync: false

      # Upstash Redis Free (Set in Render Dashboard)
      - key: UPSTASH_REDIS_URL
        sync: false
      - key: REDIS_SSL
        value: true

      # Upstash Kafka Free (Set in Render Dashboard)
      - key: KAFKA_BOOTSTRAP_SERVERS
        sync: false
      - key: KAFKA_SECURITY_PROTOCOL
        value: SASL_SSL
      - key: KAFKA_SASL_MECHANISM
        value: SCRAM-SHA-256
      - key: KAFKA_SASL_JAAS_CONFIG
        sync: false

      # Cloudflare R2 / S3 Object Storage (Set in Render Dashboard)
      - key: CLOUDFLARE_R2_ENDPOINT
        sync: false
      - key: CLOUDFLARE_R2_ACCESS_KEY_ID
        sync: false
      - key: CLOUDFLARE_R2_SECRET_ACCESS_KEY
        sync: false
      - key: CLOUDFLARE_R2_BUCKET_RAW
        value: vyroflix-raw
      - key: CLOUDFLARE_R2_BUCKET_CONTENT
        value: vyroflix-content
